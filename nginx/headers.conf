# Cabeçalhos de segurança (repetidos em cada location: o add_header de um
# location não herda os do server). A CSP fica na <meta> do index.html.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self), autoplay=(self)" always;
